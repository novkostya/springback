# Publish a tagged version to GHCR.
#
# `git tag v0.13.1 && git push --tags` is the whole release process. The version baked into the
# binary comes from the tag — without the leading `v`, via the metadata action's own `version`
# output — so `springback version` and `/api/health` report something that corresponds to a
# commit. A hand-typed VERSION goes stale silently and then lies about what is running.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The gates again, on the exact commit being published. A tag can be pushed at any moment,
      # including to a commit whose CI never ran or never finished.
      - name: gates
        run: make gates

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # v0.11.0 publishes :0.11.0, :0.11 and :latest. The two-part tag is what lets somebody
          # follow patch releases without following minor ones.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Every pin, from the one file that holds them. See ci.yml for what an empty one looks like
      # — it does not fail where it was forgotten, it fails inside git several stages later.
      - name: read the pins
        run: grep -E '^[A-Z0-9_]+=' versions.env >> "$GITHUB_ENV"

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          # arm64 as well as amd64, because the natural home for this is a Raspberry Pi or a
          # small ARM box sitting next to the devices it manages.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GO_IMAGE=${{ env.GO_IMAGE }}
            ALPINE_IMAGE=${{ env.ALPINE_IMAGE }}
            GOLANGCI_LINT_VERSION=${{ env.GOLANGCI_LINT_VERSION }}
            IPATOOL_REF=${{ env.IPATOOL_REF }}
            IDEVICEINSTALLER_REF=${{ env.IDEVICEINSTALLER_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
