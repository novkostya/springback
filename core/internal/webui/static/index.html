<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>springback</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="titlebar">
    <button id="back" class="back" hidden aria-label="Back">‹</button>
    <div>
      <h1>springback</h1>
      <p class="tagline">Keep the apps you own, after Apple stops offering them.</p>
    </div>
  </div>
  <nav>
    <button data-screen="devices" class="active">Devices</button>
    <button data-screen="library">Library</button>
    <button data-screen="accounts">Accounts</button>
  </nav>
</header>

<div id="fake-banner" class="banner warn" hidden>
  <strong>Fake tool layer.</strong> Nothing here is talking to a real device, Apple ID or App
  Store — these are fixtures for developing on a box with no hardware.
</div>

<div id="jobs"></div>

<main>
  <section id="screen-devices"></section>
  <section id="screen-library" hidden></section>
  <section id="screen-accounts" hidden></section>
  <section id="screen-app" hidden></section>
</main>

<div id="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
