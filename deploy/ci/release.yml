# Publish a tagged version to GHCR.
#
# `git tag v0.11.0 && git push --tags` is the whole release process. The version baked into the
# binary comes from the tag, so `springback version` and `/api/health` report something that
# actually corresponds to a commit — a hand-typed VERSION is the kind of thing that goes stale
# silently and then lies about which code is running.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The gates again, on the exact commit being published. A tag can be pushed at any moment,
      # including to a commit whose CI never ran or never finished.
      - name: gates
        run: make gates

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # v0.11.0 publishes :0.11.0, :0.11 and :latest. The two-part tag is what lets somebody
          # follow patch releases without following minor ones.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          # arm64 as well as amd64, because the natural home for this is a Raspberry Pi or a
          # small ARM box sitting next to the devices it manages.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
