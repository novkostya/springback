# springback + netmuxd — everything in containers, and Wi-Fi devices work.
#
# `docker compose up -d`, then open http://<the box>:8971 and choose a password.
#
# The other compose file needs usbmuxd on the host and only sees devices on the cable. This runs
# the muxer in a container too, and netmuxd speaks both transports: USB, and Wi-Fi devices found
# over mDNS. Nothing is installed on the host.
#
# Use this only if nothing else on the box is already a muxer — `ss -lx | grep usbmux` should come
# back empty. Two muxers fight over the USB bus.
#
# PAIR OVER THE CABLE ONCE, FIRST. netmuxd only serves a Wi-Fi device it holds a pairing record
# for: an mDNS advertisement carries no udid, so it matches the advertisement against the records
# in --plist-storage. With none it discovers every phone on the network and serves nothing.
#
# NETMUXD PAIRS BY ITSELF. Plug in a device it has no record for and the phone shows "Trust This
# Computer?" without anyone asking for it. There is no flag to disable it. Nothing happens unless
# someone taps the phone — but springback's own Pair button is not the only thing that can raise
# that prompt. If that matters, use compose.yml with usbmuxd, which never pairs on its own.

services:
  netmuxd:
    image: ghcr.io/jkcoxson/netmuxd:latest
    container_name: netmuxd
    restart: unless-stopped

    # HOST NETWORK IS REQUIRED: device discovery is mDNS, which is multicast on the local link,
    # and a bridged container is on a different link.
    network_mode: host

    # USB. The bind mount exposes the device nodes; the cgroup rule permits reading and writing
    # them (189 is the USB major). This is the whole requirement — `privileged: true` is the usual
    # advice and grants far more than this needs.
    #
    # If a device you have just plugged in does not appear, restart this container: netmuxd tries
    # to claim the USB interface for about five seconds and then gives up for good.
    device_cgroup_rules:
      - "c 189:* rmw"
    volumes:
      - /dev/bus/usb:/dev/bus/usb

      # Pairing records, shared with springback: springback writes one when you pair, netmuxd
      # reads it to recognise that device over Wi-Fi afterwards.
      - ./data/lockdown:/var/lib/lockdown

      # HIDES THIS COMPUTER'S OWN IDENTITY FILE, AND WI-FI DEPENDS ON IT. /var/lib/lockdown holds
      # one file that is not a pairing record — SystemConfiguration.plist — and netmuxd matches it
      # against mDNS advertisements anyway, then takes the filename for a udid and stops without
      # trying the real record. Which file it reaches first is down to directory order, so without
      # this line Wi-Fi works only by luck, silently. netmuxd does not need the file; springback
      # does, and has its own mount of the same directory.
      - /dev/null:/var/lib/lockdown/SystemConfiguration.plist

      - mux:/run/mux

    # A muxer is otherwise silent, and `docker logs netmuxd` is the first place to look when a
    # device does not appear.
    environment:
      RUST_LOG: info

    # No --host and no --port, so netmuxd listens on a unix socket and nothing else. A muxer has
    # no authentication in front of it: anything that reaches it can talk to every device it
    # serves. A socket in a shared volume is reachable by exactly the containers that mount it.
    command:
      - "--socket-path"
      - "/run/mux/usbmuxd"
      - "--plist-storage"
      - "/var/lib/lockdown"

  springback:
    image: ghcr.io/novkostya/springback:latest
    container_name: springback
    restart: unless-stopped
    depends_on: [netmuxd]
    ports:
      - "8971:8971"

    # THE DIRECTORY IS MOUNTED, NOT THE SOCKET FILE. Bind mounting the socket itself onto
    # /var/run/usbmuxd would need no environment variable at all — but if springback starts before
    # netmuxd has bound, Docker creates a DIRECTORY where the socket should be and netmuxd can
    # never bind there. Mounting the directory has no such race.
    environment:
      USBMUXD_SOCKET_ADDRESS: "UNIX:/run/mux/usbmuxd"

    volumes:
      - ./data/library:/library      # the archives — this is the one that grows
      - ./data/accounts:/accounts    # Apple ID sessions and your springback password
      - ./data/lockdown:/var/lib/lockdown
      - mux:/run/mux

volumes:
  mux:
