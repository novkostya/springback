# springback + netmuxd — everything in containers, and Wi-Fi devices work.
#
# The other compose file needs `usbmuxd` installed on the host and only ever sees devices on the
# cable. This one runs the muxer in a container too, and netmuxd speaks both transports: USB, and
# Wi-Fi devices found over mDNS. Nothing is installed on the host.
#
# Exactly one of these containers needs the host's network and its USB bus; the other is an
# ordinary web app that only needs to reach it, over a unix socket in a shared volume:
#
#   netmuxd     host network (mDNS is link-local and cannot cross a bridge) + the USB bus
#   springback  the default network, one published port, and the socket
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# THE ORDER OF OPERATIONS THAT ACTUALLY MATTERS
#
# netmuxd only serves a Wi-Fi device it holds a PAIRING RECORD for. That is not a limitation
# anyone chose: an mDNS advertisement carries no udid, so netmuxd matches the advertisement's
# authTags against the records in --plist-storage to work out which device it is seeing. With an
# empty directory it discovers every phone on the network and serves none of them — measured, and
# it logs "No paired device matched service ...".
#
# So: plug the device in over USB once and pair it. That writes the record into ./data/lockdown,
# both containers see it, and from then on Wi-Fi is enough.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# NETMUXD PAIRS BY ITSELF, AND YOU SHOULD KNOW THAT BEFORE YOU PLUG SOMETHING IN
#
# Plug in a device it has no pairing record for and netmuxd calls lockdown.pair() immediately —
# the phone shows "Trust This Computer?" without anyone having asked for it. Read from the
# source of the pinned version (daemon/mod.rs: "No valid pairing record for …; starting pair
# flow"), and there is no flag to turn it off: the complete option list is --host, --port,
# --socket-path, --plist-storage, --upstream-usbmuxd, --disable-{usb,mdns,unix,heartbeat}.
#
# It is not dangerous on a box you own — trust still requires someone to tap the phone, and
# pairing is something you were going to do anyway. But it does mean springback's own Pair
# button is not the only thing that can start a pairing, which is worth knowing if you plug in
# somebody else's phone to charge it.
#
# --disable-usb stops it, at the cost of USB entirely — which is the other compose file's
# arrangement: usbmuxd on the host does NOT pair on its own, so there the Pair button is the
# only thing that ever raises a trust prompt.
# ─────────────────────────────────────────────────────────────────────────────────────────────

services:
  netmuxd:
    # Upstream publishes this image, so there is nothing to build.
    image: ghcr.io/jkcoxson/netmuxd:latest
    container_name: netmuxd
    restart: unless-stopped

    # HOST NETWORK IS NOT OPTIONAL HERE. Device discovery is mDNS, which is multicast on the
    # local link — a bridged container is on a different link and hears none of it.
    network_mode: host

    # USB. The bind mount exposes the device nodes; the cgroup rule is what actually permits
    # reading and writing them (189 is the USB device major).
    #
    # UNPRIVILEGED IS ENOUGH. `privileged: true` is the usual advice for USB in a container and
    # grants far more than this needs; these two lines are the whole requirement.
    #
    # HOTPLUG DOES NOT WORK, and that is worth knowing before it confuses you. A device plugged
    # in AFTER this container started will not appear inside it: a bind mount does not propagate
    # device nodes created later. The remedy is one command —
    #
    #     docker compose restart netmuxd
    #
    # — and it matters exactly once per device, because pairing is once per device and Wi-Fi
    # needs no cable afterwards. Running the muxer in a container is a known trade with a known
    # price; this is the price.
    device_cgroup_rules:
      - "c 189:* rmw"
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      # The pairing records, shared with springback: springback writes one when you pair,
      # netmuxd reads it to recognise that device over Wi-Fi afterwards.
      - ./data/lockdown:/var/lib/lockdown
      - mux:/run/mux

    # A muxer is otherwise completely silent, and `docker logs netmuxd` is the first place to
    # look when a device does not appear. At `info` it names every device it adds and says
    # "No paired device matched service ..." for each one it discovers and cannot identify —
    # which is the single most useful line in this whole file when something is wrong.
    environment:
      RUST_LOG: info

    # NO --host AND NO --port, so netmuxd listens on a unix socket and nothing else. A muxer has
    # no authentication in front of it: anything that can reach it can talk to every device it
    # serves. A socket in a shared volume is reachable by exactly the containers that mount it,
    # which is the smallest surface that works.
    command:
      - "--socket-path"
      - "/run/mux/usbmuxd"
      - "--plist-storage"
      - "/var/lib/lockdown"

  springback:
    image: ghcr.io/novkostya/springback:latest
    container_name: springback
    restart: unless-stopped
    depends_on: [netmuxd]
    ports:
      - "8971:8971"

    # THE DIRECTORY IS MOUNTED, NOT THE SOCKET FILE — and that is a bug fix, not a style. Bind
    # mounting `mux/usbmuxd` straight onto /var/run/usbmuxd would need libimobiledevice's default
    # path and no environment variable at all, which is tidier and was measured to work. But if
    # springback starts before netmuxd has bound, Docker creates a DIRECTORY where the socket
    # should be, and netmuxd can then never bind there. `depends_on` does not help: it waits for
    # the container to start, not for the socket to exist. Mounting the directory has no such
    # race, because the directory is always there.
    environment:
      USBMUXD_SOCKET_ADDRESS: "UNIX:/run/mux/usbmuxd"

    volumes:
      - ./data/library:/library      # the archives — this is the one that grows
      - ./data/accounts:/accounts    # Apple ID sessions and your springback password
      - ./data/lockdown:/var/lib/lockdown
      - mux:/run/mux

volumes:
  mux:
