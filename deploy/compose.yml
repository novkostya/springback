# springback, using a muxer that already runs on the host.
#
# `docker compose up -d`, then open http://<the box>:8971 and choose a password.
#
# springback talks to iPhones through a *muxer* — usbmuxd — which owns the USB bus and must run on
# the host. It is not in this image on purpose: only one muxer may own the bus, and a second one
# fights the first.
#
#     apt install usbmuxd        # or: pacman -S usbmuxd, apk add usbmuxd
#     systemctl enable --now usbmuxd
#
# Devices on the cable only. For Wi-Fi, use compose.netmuxd.yml instead.

services:
  springback:
    image: ghcr.io/novkostya/springback:latest
    container_name: springback
    restart: unless-stopped
    ports:
      - "8971:8971"
    volumes:
      # The archives, one directory per App Store id. This is the one that grows: apps are
      # 100 MB to 1 GB each.
      - ./data/library:/library
      # Apple ID sessions and the password you set on first run. Back this up, and treat it the
      # way you would treat a password manager's vault.
      - ./data/accounts:/accounts
      # The muxer's socket — how the container reaches devices plugged into the host.
      - /var/run/usbmuxd:/var/run/usbmuxd
      # Pairing records: the proof that a device trusts this computer. Read-write, because
      # springback pairs devices itself. If something else on this box already owns them, mount
      # read-only (`:ro`) and let it keep ownership — springback will still read them to know
      # which devices exist, and will explain why its pairing controls are unavailable.
      - /var/lib/lockdown:/var/lib/lockdown

# TLS: springback works over plain http and says so on every screen. Put it behind a reverse proxy
# that terminates TLS and forwards X-Forwarded-Proto — see the README.
